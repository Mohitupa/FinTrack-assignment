<section class="metrics">
  <article class="metric-card">
    <span class="metric-label">Total transactions</span>
    <span class="metric-symbol" aria-hidden="true">
      <img src="assets/icons/total-transactions.svg" alt="">
    </span>
    <div class="metric-value">{{ summary.totalDisplayed }}</div>
  </article>

  <article class="metric-card">
    <span class="metric-label">Successful</span>
    <span class="metric-symbol" aria-hidden="true">
      <img src="assets/icons/successful.svg" alt="">
    </span>
    <div class="metric-value">
      {{ summary.successfulCount }}
      @if (successRatePercent !== null) {
      <span class="metric-detail">↗ {{ successRatePercent }}% rate</span>
      }
    </div>
  </article>

  <article class="metric-card">
    <span class="metric-label">Pending</span>
    <span class="metric-symbol" aria-hidden="true">
      <img src="assets/icons/pending.svg" alt="">
    </span>
    <div class="metric-value">{{ summary.pendingCount }}</div>
  </article>

  <article class="metric-card">
    <span class="metric-label">Total success vol.</span>
    <span class="metric-symbol" aria-hidden="true">
      <img src="assets/icons/success-vol.svg" alt="">
    </span>
    <div class="metric-value">{{ summary.totalSuccessfulAmount | currency:'INR ':'code':'1.2-2' }}</div>
  </article>
</section>
