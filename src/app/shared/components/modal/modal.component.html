<div class="modal-backdrop" (click)="onBackdropClick()">
  <div class="modal-panel" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId" cdkTrapFocus
    cdkTrapFocusAutoCapture (click)="$event.stopPropagation()">
    <button type="button" class="modal-close" (click)="close()" aria-label="Close dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
